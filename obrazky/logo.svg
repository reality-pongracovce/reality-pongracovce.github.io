<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Univerzálna značka: strecha nad pozemkom — vhodná pre akúkoľvek nehnuteľnosť -->
  <rect width="96" height="96" rx="18" fill="#1e3a2a"/>
  <!-- strecha -->
  <path d="M16 46 L48 22 L80 46" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- budova -->
  <path d="M26 48 L26 72 L70 72 L70 48" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- brána -->
  <rect x="42" y="56" width="12" height="16" rx="2" fill="#c8892e"/>
  <!-- polia / riadky pozemku -->
  <line x1="14" y1="82" x2="34" y2="82" stroke="#c8892e" stroke-width="5" stroke-linecap="round"/>
  <line x1="40" y1="82" x2="56" y2="82" stroke="#8aa08f" stroke-width="5" stroke-linecap="round"/>
  <line x1="62" y1="82" x2="82" y2="82" stroke="#c8892e" stroke-width="5" stroke-linecap="round"/>
</svg>
